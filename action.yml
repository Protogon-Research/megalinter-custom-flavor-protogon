---
name: "MegaLinter Custom Flavor: protogon"
author: "Benjamin Cosman"
description: "MegaLinter Custom Flavor protogon"
outputs:
  has_updated_sources:
    description: "0 if no source file has been updated, 1 if source files has been updated"
runs:
  using: "docker"
  # Optional wrapper: the monorepo references the image directly by digest in
  # its own workflow (see README "How to use"), so nothing depends on this file.
  # Pinned by digest, not by tag, so anyone who does use it gets an immutable
  # image: a tag can be re-pushed by anything with packages:write on this repo,
  # a digest cannot. Keep the digest and version comment in step with the
  # monorepo when upgrading (README: "Looking up an image digest").
  image: "docker://ghcr.io/protogon-research/megalinter-custom-flavor-protogon/megalinter-custom-flavor@sha256:a082d8ae41674f1f244952fe3aaff319859596cd1c20de5e1f1ba2d8089de6d4" # v10.1.0
branding:
  icon: "check"
  color: "green"
